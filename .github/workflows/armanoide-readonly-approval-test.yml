name: Armanoide - read-only approval smoke test

# PROPOSAL ONLY: Actions must remain disabled until separate security approval.
# No credentials, checkout, third-party actions, or write operations.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armanoide-readonly-approval-test
  cancel-in-progress: false

jobs:
  approval-smoke-test:
    name: Human approval gate - no secrets
    runs-on: ubuntu-latest
    environment: armanoide-secure-execution
    timeout-minutes: 5
    steps:
      - name: Confirm approved execution context
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "ccam22430/armanoide-controller"
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$REF_NAME" = "main"
          printf '%s\n' "Approval gate passed; read-only smoke test completed."
